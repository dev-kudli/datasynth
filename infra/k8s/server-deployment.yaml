apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: generatedata-server:3.2
          imagePullPolicy: Never   # use local image from Minikube docker-env
          ports:
            - containerPort: 3001  # replace with ${GD_API_SERVER_PORT}
          env:
            - name: GD_MYSQL_HOST
              value: "mariadb"
            - name: GD_MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: root-password
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: server
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
